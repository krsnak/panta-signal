name: Collect Panta signals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: panta-signal-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect live Panta snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl +            --fail-with-body +            --silent +            --show-error +            --retry 2 +            --retry-all-errors +            --max-time 55 +            -H "Authorization: Bearer $CRON_SECRET" +            "https://panta-signal.vercel.app/api/cron/collect-signals"
